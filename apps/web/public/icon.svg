<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="nya-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111D35" />
      <stop offset="100%" stop-color="#0b1324" />
    </linearGradient>
    <filter id="teal-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Midnight Indigo Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#nya-bg)" stroke="#5CE1D0" stroke-width="2" stroke-opacity="0.4" />
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="#5CE1D0" stroke-width="1" stroke-opacity="0.15" />
  
  <!-- Central Brand Glyph ঞ in Signal Teal -->
  <text 
    x="32" 
    y="44" 
    text-anchor="middle" 
    font-family="'Noto Sans Bengali', 'Mukti Narrow', 'SolaimanLipi', 'Segoe UI', system-ui, sans-serif" 
    font-size="38" 
    font-weight="bold" 
    fill="#5CE1D0"
    filter="url(#teal-glow)">ঞ</text>
</svg>
