version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: nya-search-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nya_search
      POSTGRES_USER: nya_user
      POSTGRES_PASSWORD: nya_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nya_user -d nya_search"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
