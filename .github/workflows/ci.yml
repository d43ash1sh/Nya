name: ঞ (Nya) CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  frontend-check:
    name: Frontend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: TypeScript Type Check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Next.js Production Build
        working-directory: apps/web
        run: npm run build

      - name: Run Component Verification Tests
        working-directory: apps/web
        run: node test-runner.js

  backend-check:
    name: Backend & Multilingual NLP Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/search-api/requirements.txt

      - name: Run Pytest Test Suite
        run: |
          pytest -v tests/

      - name: Run Multilingual Evaluation Harness
        run: |
          python evaluation/evaluate.py
